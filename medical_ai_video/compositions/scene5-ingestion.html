      <script>
        (function() {
          const tl = gsap.timeline({ paused: true });
          window.__timelines = window.__timelines || {};
      window.__timelines["scene5-ingestion"] = tl;

      // Initial state
      tl.set("#cursor", { x: 500, y: 300, opacity: 0 });
      tl.set("#dragged-file", { x: 400, y: 250, opacity: 0 });
      tl.set("#file-accepted", { display: "none", opacity: 0 });
      tl.set("#analysis-progress-box", { display: "none", opacity: 0 });

      // 0.0s - 0.5s: Modal in place, cursor appears
      tl.to("#cursor", { opacity: 1, duration: 0.3 }, 0.5);

      // 0.8s - 2.0s: Cursor moves to inspect Radiology department pill
      tl.to("#cursor", { x: 740, y: 360, duration: 1.0, ease: "power2.inOut" }, 0.8);

      // 2.5s: Incoming scan file floats in
      tl.to("#dragged-file", { opacity: 1, duration: 0.4 }, 2.5);
      tl.to("#cursor", { x: 420, y: 270, duration: 0.5 }, 2.5);

      // 3.2s - 5.2s: Cursor drags the file into the dashed dropzone!
      tl.to(["#cursor", "#dragged-file"], {
        x: "+=520",
        y: "+=320",
        duration: 2.0,
        ease: "power2.inOut"
      }, 3.2);

      // 5.4s: Drop event! Dropzone activates blue highlight
      tl.call(() => {
        document.getElementById("dropzone").classList.add("border-[#246BFD]", "bg-[#E7EEFE]/30", "ring-4", "ring-[#246BFD]/15");
      }, null, 5.4);

      // 5.6s: File badge disappears and docks inside dropzone
      tl.to("#dragged-file", { scale: 0.8, opacity: 0, duration: 0.2 }, 5.6);
      tl.call(() => {
        document.getElementById("drop-prompt").style.display = "none";
        const fa = document.getElementById("file-accepted");
        fa.style.display = "flex";
      }, null, 5.7);
      tl.to("#file-accepted", { opacity: 1, duration: 0.3 }, 5.8);

      // 6.5s - 7.5s: Move cursor to "Process & Analyze Diagnostic Study" button
      tl.to("#cursor", { x: 1210, y: 775, duration: 0.9, ease: "power2.inOut" }, 6.5);

      // 7.8s: Button Click
      tl.to("#analyze-btn", { scale: 0.96, duration: 0.1 }, 7.8);
      tl.to("#analyze-btn", { scale: 1, duration: 0.15 }, 7.9);

      // 8.0s: Progress box appears
      tl.call(() => {
        const pb = document.getElementById("analysis-progress-box");
        pb.style.display = "flex";
      }, null, 8.0);
      tl.to("#analysis-progress-box", { opacity: 1, duration: 0.3 }, 8.1);

      // 8.5s - 12.0s: Deterministic Multi-stage Analysis Progress
      tl.call(() => {
        document.getElementById("analysis-status-text").innerHTML = '<span class="w-3.5 h-3.5 border-2 border-[#154CC1]/30 border-t-[#154CC1] rounded-full animate-spin"></span><span>Extracting DICOM metadata & pixel volumetric arrays...</span>';
        document.getElementById("analysis-pct").textContent = "38%";
        document.getElementById("analysis-bar").style.width = "38%";
      }, null, 8.5);

      tl.call(() => {
        document.getElementById("analysis-status-text").innerHTML = '<span class="w-3.5 h-3.5 border-2 border-[#154CC1]/30 border-t-[#154CC1] rounded-full animate-spin"></span><span>Running MedGemma 27B multimodal reasoning...</span>';
        document.getElementById("analysis-pct").textContent = "76%";
        document.getElementById("analysis-bar").style.width = "76%";
      }, null, 10.0);

      tl.call(() => {
        document.getElementById("analysis-status-text").innerHTML = '<svg class="w-4 h-4 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><span class="text-emerald-700 font-bold">Analysis complete (1.2s latency) • Slices aligned</span>';
        document.getElementById("analysis-pct").textContent = "100%";
        document.getElementById("analysis-bar").style.width = "100%";
        document.getElementById("analysis-bar").classList.remove("bg-[#246BFD]");
        document.getElementById("analysis-bar").classList.add("bg-[#147145]");
      }, null, 11.5);

      // 12.5s - 14.0s: Smooth fade ready for Radiology Workspace
      tl.to("#upload-dialog", { scale: 1.01, opacity: 0, duration: 0.8, ease: "power2.in" }, 13.0);

          tl.seek(0);
        })();
      </script>
    </template>
