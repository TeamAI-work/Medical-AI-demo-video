      <script>
        (function() {
          const tl = gsap.timeline({ paused: true });
          window.__timelines = window.__timelines || {};
      window.__timelines["scene8-ophthalmology"] = tl;

      function buildTypingSteps(text) {
        const steps = [];
        for (let i = 1; i <= text.length; i++) {
          steps.push(text.slice(0, i));
        }
        return steps;
      }

      // Initial state
      tl.set("#cursor", { x: 500, y: 300, opacity: 0 });
      tl.set("#ophth-ring", { scale: 0.9, opacity: 0 });
      tl.set("#msg-user", { display: "none", opacity: 0 });
      tl.set("#msg-ai", { display: "none", opacity: 0 });

      // 0.0s - 0.5s: Cursor enters
      tl.to("#cursor", { opacity: 1, duration: 0.3 }, 0.5);

      // 1.0s: AI Optic Disc tracking ring locks onto optic nerve head
      tl.to("#ophth-ring", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 1.0);

      // 2.5s - 4.5s: Cursor inspects CDR 0.68 cupping indicator
      tl.to("#cursor", { x: 380, y: 480, duration: 1.0, ease: "power2.inOut" }, 2.5);

      // 5.5s - 7.5s: Move cursor to Chat Input Box
      tl.to("#cursor", { x: 1600, y: 885, duration: 1.2, ease: "power2.inOut" }, 5.5);

      // 7.8s: Focus Chat Input
      tl.call(() => {
        document.getElementById("chat-ph").style.display = "none";
        document.getElementById("chat-caret").style.display = "inline-block";
        document.getElementById("chat-input-box").classList.add("border-[#1D3463]", "bg-white", "ring-2", "ring-[#1D3463]/10");
      }, null, 7.8);

      // 8.0s - 12.0s: Real human character-by-character typing:
      const chatQuery = "Diabetic retinopathy staging and follow-up interval?";
      const chatSteps = buildTypingSteps(chatQuery);
      chatSteps.forEach((str, i) => {
        const t = 8.0 + (i * 0.08);
        tl.call(() => {
          document.getElementById("chat-val").textContent = str;
        }, null, t);
      });

      // 12.5s - 13.2s: Move cursor to Send Button
      tl.to("#cursor", { x: 1870, y: 885, duration: 0.5, ease: "power2.inOut" }, 12.5);

      // 13.5s: Click Send
      tl.to("#chat-send-btn", { scale: 0.94, duration: 0.1 }, 13.5);
      tl.to("#chat-send-btn", { scale: 1, duration: 0.15 }, 13.6);

      // 13.7s: Show user bubble
      tl.call(() => {
        document.getElementById("chat-caret").style.display = "none";
        document.getElementById("chat-val").textContent = "";
        document.getElementById("chat-ph").style.display = "inline";
        document.getElementById("typed-query").textContent = chatQuery;
        const u = document.getElementById("msg-user");
        u.style.display = "block";
      }, null, 13.7);
      tl.to("#msg-user", { opacity: 1, duration: 0.2 }, 13.8);

      // 14.5s: MedGemma Retinal AI returns staging & follow-up
      tl.call(() => {
        const a = document.getElementById("msg-ai");
        a.style.display = "flex";
      }, null, 14.5);
      tl.to("#msg-ai", { opacity: 1, duration: 0.4, ease: "power2.out" }, 14.6);

      // 16.0s - 17.5s: Cursor moves to inspect ICDR staging recommendations
      tl.to("#cursor", { x: 1650, y: 560, duration: 1.2, ease: "power2.inOut" }, 16.0);

      // 18.0s - 19.5s: Cursor returns to inspect Optic Disc CDR ring
      tl.to("#cursor", { x: 380, y: 480, duration: 1.2, ease: "power2.inOut" }, 18.0);

      // 20.0s - 21.5s: Optic disc ring pulses
      tl.to("#ophth-ring", { scale: 1.08, duration: 0.6, yoyo: true, repeat: 1, ease: "power1.inOut" }, 20.0);

          tl.seek(0);
        })();
      </script>
