                  <span id="reason-val" class="font-medium text-[#16233B]"></span>
                  <span id="reason-caret" class="caret" style="display: none;"></span>
                  <span id="reason-ph" class="text-[#8C98A9]">e.g. Acute pleuritic chest pain</span>
                </div>
              </div>

              <!-- Priority -->
              <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-[#16233B]">Priority Level</label>
                <div id="priority-box" class="h-9 px-3 text-xs font-bold text-[#AD1F1F] bg-[#FDEAEA] border border-[#E13333]/30 rounded-lg flex items-center justify-between">
                  <span>Urgent STAT (15-min emergency queue)</span>
                  <span class="text-[10px] bg-white px-2 py-0.5 rounded border border-[#E13333]/30">High Priority</span>
                </div>
              </div>

              <!-- 15-Minute Queue Time Slot Allocation Widget (Exact DashboardPage.jsx lines 1461-1525) -->
              <div class="p-3 bg-[#E7EEFE]/60 border border-[#246BFD]/25 rounded-xl flex flex-col gap-2">
                <div class="flex items-center justify-between">
                  <label class="text-[11px] font-semibold text-[#154CC1] flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-[#246BFD]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>Allocated 15-minute diagnostic time slot</span>
                  </label>
                  <span class="text-[10px] font-bold text-[#154CC1] bg-white px-2 py-0.5 rounded-full border border-[#246BFD]/20">
                    15 min / patient
                  </span>
                </div>

                <div class="flex items-center gap-2">
                  <div class="h-9 px-3 text-xs font-mono font-bold text-[#16233B] bg-white border border-[#246BFD] rounded-lg flex items-center">
                    09:30 AM
                  </div>
                  <div class="flex items-center gap-1">
                    <button type="button" class="px-2.5 py-1.5 bg-white border border-[#DCE2EA] rounded-lg text-[10.5px] font-medium text-[#16233B]">-15m</button>
                    <button type="button" class="px-2.5 py-1.5 bg-white border border-[#DCE2EA] rounded-lg text-[10.5px] font-medium text-[#16233B]">+15m</button>
                    <button type="button" class="px-2.5 py-1.5 bg-[#1D3463] text-white rounded-lg text-[10.5px] font-semibold">Next available</button>
                  </div>
                </div>

                <div class="flex items-center justify-between text-[11px] text-[#637188]">
                  <div>Scheduled window: <strong class="text-[#16233B] font-mono">09:30 AM – 09:45 AM</strong></div>
                  <div class="text-[10px] text-emerald-700 font-semibold">✓ Slot Unoccupied</div>
                </div>
              </div>
            </div>

            <!-- Modal Action Footer -->
            <div class="px-6 py-4 bg-[#F8FAFC] border-t border-[#DCE2EA] flex items-center justify-end gap-2.5">
              <button type="button" class="px-4 py-2 text-xs font-medium text-[#637188] hover:bg-slate-200 rounded-full">Cancel</button>
              <button
                id="submit-intake-btn"
                type="button"
                class="px-5 py-2 text-xs font-semibold text-white bg-[#1D3463] hover:bg-[#15274D] rounded-full shadow-xs flex items-center gap-2 cursor-pointer transition-all"
              >
                <span>Register & Add to 15-Min Queue</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function() {
          const tl = gsap.timeline({ paused: true });
          window.__timelines = window.__timelines || {};
      window.__timelines["scene4-registration"] = tl;

      function buildTypingSteps(text) {
        const steps = [];
        for (let i = 1; i <= text.length; i++) {
          steps.push(text.slice(0, i));
        }
        return steps;
      }

      // Initial state
      tl.set("#cursor", { x: 1200, y: 350, opacity: 0 });
      tl.set("#reg-backdrop", { display: "none", opacity: 0 });
      tl.set("#reg-card", { scale: 0.95, y: 10 });
      tl.set("#row-eleanor", { display: "none", opacity: 0 });

      // 0.0s - 0.5s: Dashboard ready, cursor enters
      tl.to("#cursor", { opacity: 1, duration: 0.3 }, 0.5);

      // 0.8s - 1.8s: Cursor moves to "+ Register & queue patient" button
      tl.to("#cursor", { x: 1780, y: 95, duration: 1.0, ease: "power2.inOut" }, 0.8);

      // 2.0s: Button click effect
      tl.to("#open-register-btn", { scale: 0.96, duration: 0.1 }, 2.0);
      tl.to("#open-register-btn", { scale: 1, duration: 0.15 }, 2.1);

      // 2.2s: Open Registration Modal
      tl.call(() => {
        const bd = document.getElementById("reg-backdrop");
        bd.style.display = "flex";
      }, null, 2.2);
      tl.to("#reg-backdrop", { opacity: 1, duration: 0.3 }, 2.2);
      tl.to("#reg-card", { scale: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 2.2);

      // 2.8s - 3.4s: Cursor moves to Full Name field
      tl.to("#cursor", { x: 960, y: 335, duration: 0.6, ease: "power2.inOut" }, 2.8);

      // Focus name input
      tl.call(() => {
        document.getElementById("name-ph").style.display = "none";
        document.getElementById("name-caret").style.display = "inline-block";
        document.getElementById("name-box").classList.add("border-[#246BFD]", "ring-2", "ring-[#246BFD]/15");
      }, null, 3.5);

      // 3.6s - 5.8s: Real typing of "Eleanor Vance"
      const nameText = "Eleanor Vance";
      const nameSteps = buildTypingSteps(nameText);
      nameSteps.forEach((str, i) => {
        const t = 3.6 + (i * 0.16);
        tl.call(() => {
          document.getElementById("name-val").textContent = str;
        }, null, t);
      });

      // 6.2s - 6.8s: Cursor moves to Reason field
      tl.to("#cursor", { x: 960, y: 495, duration: 0.6, ease: "power2.inOut" }, 6.2);

      // Focus reason input
      tl.call(() => {
        document.getElementById("name-caret").style.display = "none";
        document.getElementById("name-box").classList.remove("border-[#246BFD]", "ring-2", "ring-[#246BFD]/15");
        document.getElementById("reason-ph").style.display = "none";
        document.getElementById("reason-caret").style.display = "inline-block";
        document.getElementById("reason-box").classList.add("border-[#246BFD]", "ring-2", "ring-[#246BFD]/15");
      }, null, 6.8);

      // 7.0s - 10.0s: Real typing of clinical reason
      const reasonText = "Acute pleuritic chest pain & hemoptysis";
      const reasonSteps = buildTypingSteps(reasonText);
      reasonSteps.forEach((str, i) => {
        const t = 7.0 + (i * 0.08);
        tl.call(() => {
          document.getElementById("reason-val").textContent = str;
        }, null, t);
      });

      // 10.4s - 11.2s: Cursor moves to Priority STAT box
      tl.to("#cursor", { x: 960, y: 550, duration: 0.7, ease: "power2.inOut" }, 10.4);

      // Hide reason caret
      tl.call(() => {
        document.getElementById("reason-caret").style.display = "none";
        document.getElementById("reason-box").classList.remove("border-[#246BFD]", "ring-2", "ring-[#246BFD]/15");
      }, null, 11.0);

      // 11.8s - 12.6s: Move cursor to "Register & Add to 15-Min Queue" submit button
      tl.to("#cursor", { x: 1140, y: 760, duration: 0.7, ease: "power2.inOut" }, 11.8);

      // 12.8s: Submit Button Press Click
      tl.to("#submit-intake-btn", { scale: 0.96, duration: 0.1 }, 12.8);
      tl.to("#submit-intake-btn", { scale: 1, duration: 0.15 }, 12.9);

      // 13.0s: Modal scales out and dismisses
      tl.to("#reg-card", { scale: 0.95, opacity: 0, duration: 0.25 }, 13.0);
      tl.to("#reg-backdrop", { opacity: 0, duration: 0.3 }, 13.1);
      tl.call(() => {
        document.getElementById("reg-backdrop").style.display = "none";
      }, null, 13.4);

      // 13.6s: Eleanor Vance row appears in queue!
      tl.call(() => {
        const row = document.getElementById("row-eleanor");
        row.style.display = "flex";
      }, null, 13.6);
      tl.to("#row-eleanor", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.7);

      // 14.5s - 15.5s: Cursor moves to Eleanor Vance's row
      tl.to("#cursor", { x: 1150, y: 460, duration: 0.8, ease: "power2.inOut" }, 14.5);

          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
