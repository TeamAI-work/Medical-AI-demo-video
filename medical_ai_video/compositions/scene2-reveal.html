          z-index: 10;
        }

        /* Geometric Multi-Modality Shield */
        .emblem-wrapper {
          position: relative;
          width: 140px;
          height: 140px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
        }

        .emblem-ring {
          position: absolute;
          inset: 0;
          border-radius: 36px;
          border: 2px solid rgba(255, 255, 255, 0.15);
          box-shadow: 0 0 40px rgba(36, 107, 253, 0.4);
          transform: rotate(45deg);
        }

        .emblem-core {
          width: 88px;
          height: 88px;
          background: linear-gradient(135deg, #1D3463 0%, #246BFD 100%);
          border-radius: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 8px 30px rgba(36, 107, 253, 0.6);
          position: relative;
          overflow: hidden;
        }

        .laser-sweep {
          position: absolute;
          top: -20%;
          left: -40%;
          width: 200%;
          height: 8px;
          background: linear-gradient(90deg, transparent, #FFFFFF, transparent);
          box-shadow: 0 0 15px #FFFFFF;
          transform: rotate(-35deg);
        }

        /* Typography */
        .brand-name {
          font-size: 68px;
          font-weight: 900;
          letter-spacing: -0.03em;
          background: linear-gradient(180deg, #FFFFFF 0%, #E2EDFD 100%);

          -webkit-text-fill-color: transparent;

        .brand-role {

        .brand-tagline {

          font-weight: 500;
          color: #94A3B8;
          max-width: 700px;
          line-height: 1.5;

        .modality-badge {
          display: flex;
          align-items: center;
          gap: 8px;

          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 9999px;
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.02em;
          color: #E2E8F0;
          backdrop-filter: blur(10px);
        }

        .badge-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;

            <div data-hf-id="hf-aiau" class="emblem-core">
              <svg data-hf-id="hf-r9m1" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path data-hf-id="hf-06ci" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function() {
          const tl = gsap.timeline({ paused: true });

          // Emblem entry
          tl.fromTo("#emblem", 
            { scale: 0.4, opacity: 0, rotate: -20 }, 
            { scale: 1, opacity: 1, rotate: 0, duration: 1.0, ease: "back.out(1.4)" }, 
            0.2
          );

          // Laser sweep across core (using transforms for subpixel smoothness)
          tl.fromTo("#laser-sweep", 
            { x: -80, y: -80 }, 
            { x: 120, y: 120, duration: 0.8, ease: "power2.inOut" }, 
            0.9
          );

          // Ring rotation
          tl.fromTo("#emblem-ring", 
            { rotate: 0 }, 
            { rotate: 90, duration: 10.0, ease: "none" }, 
            0.2
          );

          // Text reveals
          tl.fromTo("#brand-name", 
            { y: 35, opacity: 0, filter: "blur(6px)" }, 
            { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 
            1.2
          );

          tl.fromTo("#brand-role", 
            { y: 20, opacity: 0 }, 
            { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 
            1.8
          );

          tl.fromTo("#brand-tagline", 
            { y: 15, opacity: 0 }, 
            { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 
            2.5
          );

          // Modality badges stagger
          tl.fromTo(".modality-badge", 
            { y: 20, opacity: 0, scale: 0.95 }, 
            { y: 0, opacity: 1, scale: 1, duration: 0.5, stagger: 0.15, ease: "power2.out" }, 
            3.4
          );

          // Smooth scale-in transition towards end of scene preparing for login
          tl.fromTo(".brand-container", 
            { scale: 1 }, 
            { scale: 1.12, duration: 4.0, ease: "power1.in" }, 
            8.0
          );

          window.__timelines["scene2-reveal"] = tl;
          tl.seek(0);
        })();
      </script>
