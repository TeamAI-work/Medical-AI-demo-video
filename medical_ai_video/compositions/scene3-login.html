<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 3: Physician Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="m-0 p-0 overflow-hidden bg-[#F4F6F9]">
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: #F4F6F9;
          font-family: 'Inter', sans-serif;
          color: #16233B;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .virtual-cursor {
          position: absolute;
          width: 24px;
          height: 24px;
          z-index: 100;
          pointer-events: none;
          filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .caret {
          display: inline-block;
          width: 2px;
          height: 14px;
          background: #1D3463;
          margin-left: 1px;
          vertical-align: middle;
          animation: blink 0.8s infinite;
        }

        @keyframes blink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }
      </style>

      <div data-hf-id="hf-root3" id="root" data-composition-id="scene3-login" data-width="1920" data-height="1080">
        <!-- Virtual Cursor -->
        <svg data-hf-id="hf-cursor3" id="cursor" class="virtual-cursor clip" data-start="0.5" data-duration="13.5" viewBox="0 0 24 24" fill="none">
          <path data-hf-id="hf-cpath3" d="M5.5 3.5l12 11.5-5.5 1-2.5 5-2.5-1 2.5-5-4-1.5z" fill="#16233B" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>

        <!-- EXACT Cloned ClinicalAccessGate.jsx Card -->
        <div data-hf-id="hf-gate-card" id="gate-card" class="w-full max-w-[420px] bg-white border border-[#E2E8F0] rounded-2xl shadow-[0_12px_40px_rgba(22,35,59,0.08)] p-8 flex flex-col gap-6">
          
          <!-- Header Branding (Exact AppLogo + Title) -->
          <div data-hf-id="hf-hdr3" class="flex flex-col items-center text-center gap-2">
            <div data-hf-id="hf-logo3" class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl border border-[#DCE2EA] bg-white shadow-xs flex items-center justify-center shrink-0 p-1">
                <span class="font-black text-xs text-[#E13333] tracking-tighter leading-none select-none font-sans">MV</span>
              </div>
              <div class="min-w-0 text-left">
                <h1 class="text-sm font-semibold text-[#16233B] tracking-tight leading-tight truncate">MedVision AI</h1>
                <span class="text-[10px] text-[#637188] block truncate leading-tight">Life Care Medico Hospital</span>
              </div>
            </div>

            <div class="mt-1">
              <h1 class="text-base font-bold text-[#16233B] tracking-tight">Physician Sign In</h1>
              <p class="text-xs text-[#637188] mt-0.5">Clinical AI Diagnostic Platform</p>
            </div>
          </div>

          <!-- Minimal Form -->
          <div data-hf-id="hf-form3" class="flex flex-col gap-4">
            <!-- Username Input -->
            <div>
              <label class="block text-[11px] font-semibold text-[#637188] uppercase tracking-wider mb-1.5">
                Username or Email
              </label>
              <div id="username-box" class="relative flex items-center bg-[#F8FAFC] border border-[#DCE2EA] rounded-xl transition-all">
                <svg class="w-4 h-4 text-[#8C98A9] absolute left-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <div class="w-full pl-10 pr-3.5 py-2.5 text-xs text-[#16233B] flex items-center min-h-[38px]">
                  <span id="user-val" class="font-medium text-[#16233B]"></span>
                  <span id="user-caret" class="caret" style="display: none;"></span>
                  <span id="user-ph" class="text-[#8C98A9]">e.g. dr.sarah</span>
                </div>
              </div>
            </div>

            <!-- Password Input -->
            <div>
              <label class="block text-[11px] font-semibold text-[#637188] uppercase tracking-wider mb-1.5">
                Password
              </label>
              <div id="password-box" class="relative flex items-center bg-[#F8FAFC] border border-[#DCE2EA] rounded-xl transition-all">
                <svg class="w-4 h-4 text-[#8C98A9] absolute left-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <div class="w-full pl-10 pr-10 py-2.5 text-xs text-[#16233B] flex items-center min-h-[38px] tracking-widest">
                  <span id="pass-val" class="font-bold text-[#16233B]"></span>
                  <span id="pass-caret" class="caret" style="display: none;"></span>
                  <span id="pass-ph" class="text-[#8C98A9] tracking-normal font-normal">••••••••••••</span>
                </div>
                <div class="absolute right-3 text-[#8C98A9]">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Sign In Button -->
            <button
              id="signin-btn"
              type="button"
              class="w-full mt-2 py-2.5 rounded-xl bg-[#1D3463] hover:bg-[#15274D] active:scale-[0.99] text-white font-semibold text-xs flex items-center justify-center gap-2 shadow-sm transition-all cursor-pointer"
            >
              <span id="btn-normal" class="flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                <span>Sign In</span>
              </span>
              <span id="btn-spinner" class="items-center gap-2 hidden">
                <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                <span>Authenticating...</span>
              </span>
              <span id="btn-verified" class="items-center gap-1.5 hidden text-emerald-300">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Access Granted</span>
              </span>
            </button>
          </div>

          <!-- Minimal Footer -->
          <div data-hf-id="hf-ftr3" class="pt-2 border-t border-[#F1F4F8] flex items-center justify-center gap-1.5 text-[10px] text-[#8C98A9]">
            <svg class="w-3.5 h-3.5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>
            </svg>
            <span>Encrypted HIPAA-compliant clinical access</span>
          </div>
        </div>
      </div>

      <script>
        (function() {
          const tl = gsap.timeline({ paused: true });
          window.__timelines = window.__timelines || {};
      window.__timelines["scene3-login"] = tl;

      // Deterministic Character-by-character typing helper
      function buildTypingSteps(text) {
        const steps = [];
        for (let i = 1; i <= text.length; i++) {
          steps.push(text.slice(0, i));
        }
        return steps;
      }

      // Initial state
      tl.set("#cursor", { x: 1200, y: 750, opacity: 0 });
      tl.set("#gate-card", { scale: 1, opacity: 1, y: 0 });

      // 0.0s - 0.5s: Cursor enters
      tl.to("#cursor", { opacity: 1, duration: 0.4 }, 0.2);

      // 1.0s - 1.6s: Move cursor to Username field
      tl.to("#cursor", { x: 960, y: 495, duration: 0.8, ease: "power2.inOut" }, 1.0);

      // Focus Username input
      tl.call(() => {
        document.getElementById("user-ph").style.display = "none";
        document.getElementById("user-caret").style.display = "inline-block";
        document.getElementById("username-box").classList.add("border-[#1D3463]", "bg-white", "ring-2", "ring-[#1D3463]/10");
      }, null, 1.8);

      // 1.9s - 3.8s: Real human typing "dr.sarah"
      const userText = "dr.sarah";
      const userSteps = buildTypingSteps(userText);
      userSteps.forEach((str, i) => {
        const t = 1.9 + (i * 0.18);
        tl.call(() => {
          document.getElementById("user-val").textContent = str;
        }, null, t);
      });

      // 4.0s - 4.6s: Move cursor to Password field
      tl.to("#cursor", { x: 960, y: 565, duration: 0.6, ease: "power2.inOut" }, 4.0);

      // Switch carets & focus password input
      tl.call(() => {
        document.getElementById("user-caret").style.display = "none";
        document.getElementById("username-box").classList.remove("border-[#1D3463]", "bg-white", "ring-2", "ring-[#1D3463]/10");
        document.getElementById("pass-ph").style.display = "none";
        document.getElementById("pass-caret").style.display = "inline-block";
        document.getElementById("password-box").classList.add("border-[#1D3463]", "bg-white", "ring-2", "ring-[#1D3463]/10");
      }, null, 4.6);

      // 4.7s - 6.5s: Typing password bullet dots
      const passText = "••••••••••••";
      const passSteps = buildTypingSteps(passText);
      passSteps.forEach((str, i) => {
        const t = 4.7 + (i * 0.14);
        tl.call(() => {
          document.getElementById("pass-val").textContent = str;
        }, null, t);
      });

      // 6.8s - 7.6s: Move cursor to "Sign In" button
      tl.to("#cursor", { x: 960, y: 645, duration: 0.7, ease: "power2.inOut" }, 6.8);

      // Hide pass caret
      tl.call(() => {
        document.getElementById("pass-caret").style.display = "none";
        document.getElementById("password-box").classList.remove("border-[#1D3463]", "bg-white", "ring-2", "ring-[#1D3463]/10");
      }, null, 7.5);

      // 7.8s: Button Press Click effect
      tl.to("#signin-btn", { scale: 0.98, duration: 0.1 }, 7.8);
      tl.to("#signin-btn", { scale: 1, duration: 0.15 }, 7.9);

      // Switch to authenticating spinner
      tl.call(() => {
        document.getElementById("btn-normal").classList.add("hidden");
        document.getElementById("btn-spinner").classList.remove("hidden");
        document.getElementById("btn-spinner").classList.add("flex");
      }, null, 7.9);

      // 8.8s: Access granted state
      tl.call(() => {
        document.getElementById("btn-spinner").classList.remove("flex");
        document.getElementById("btn-spinner").classList.add("hidden");
        document.getElementById("btn-verified").classList.remove("hidden");
        document.getElementById("btn-verified").classList.add("flex");
        document.getElementById("signin-btn").classList.remove("bg-[#1D3463]");
        document.getElementById("signin-btn").classList.add("bg-[#147145]");
      }, null, 8.8);

      // 9.5s: Cursor glides toward HIPAA encrypted security badge
      tl.to("#cursor", { x: 960, y: 700, duration: 0.8, ease: "power2.inOut" }, 9.5);

      // 10.8s - 12.8s: Smooth scale out
      tl.to("#gate-card", { scale: 1.03, opacity: 0, y: -20, duration: 1.2, ease: "power2.in" }, 11.2);

          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
