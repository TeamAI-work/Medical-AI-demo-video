              <!-- Attached PDF Report -->
              <div class="pt-2 border-t border-[#DCE2EA] flex flex-col gap-1.5 shrink-0">

                  <div class="flex items-center gap-2">

                    <div>
                      <div class="text-[11px] font-semibold text-[#16233B]">clinical_dermoscopy_evaluation.pdf</div>

            <!-- SECTION 2 (MIDDLE): DIAGNOSTIC DERMATOLOGY REPORT & ABCD CRITERIA -->
            <div class="col-span-4 bg-white/95 rounded-2xl border border-[#DCE2EA] shadow-xs flex flex-col min-h-0 overflow-hidden">
              <div class="px-4 py-3 border-b border-[#DCE2EA] flex items-center justify-between bg-white shrink-0">
                <h3 class="text-xs font-bold text-[#16233B] uppercase tracking-wider">Diagnostic Dermatology Report</h3>
                <span class="text-[10px] font-mono text-[#637188] bg-[#F1F5F9] px-1.5 py-0.5 rounded border border-[#DCE2EA]">PT-DERM-4821</span>
              </div>

              <div class="p-4 flex-1 overflow-y-auto flex flex-col gap-3 text-xs leading-relaxed">
                <!-- Indication -->
                <div>
                  <span class="font-bold text-[#16233B]">Indication:</span>

                </div>

                <!-- ABCD Scoring Card (Exact Dermatology Specs) -->
                <div class="p-3 bg-[#FFF4DB]/60 border border-[#EB8D0A]/30 rounded-xl flex flex-col gap-2">
                  <div class="flex items-center justify-between border-b border-[#EB8D0A]/20 pb-1.5">
                    <span class="font-bold text-[#974D0C] text-xs">ABCD Dermatoscopic Scoring Matrix</span>

                  </div>
                  <div class="grid grid-cols-2 gap-2 text-[11px]">

              </div>
            </div>

            <!-- SECTION 3 (RIGHT): REPORTCHATPANEL.JSX CO-PILOT -->
            <div class="col-span-4 bg-white/95 rounded-2xl border border-[#DCE2EA] shadow-xs flex flex-col min-h-0 overflow-hidden">
              <div class="px-4 py-3 bg-white border-b border-[#DCE2EA] flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2.5">
                  <div class="w-8 h-8 rounded-xl bg-[#E7EEFE] text-[#154CC1] border border-[#246BFD]/25 flex items-center justify-center shrink-0 shadow-xs">
                    <svg class="w-4 h-4 text-[#246BFD]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                  </div>
                  <div>
                    <h4 class="text-xs font-bold text-[#16233B] leading-tight">Clinical Report AI Co-Pilot</h4>
                    <span class="text-[10px] text-[#637188] block">Grounded in Dermoscopy & ABCD criteria</span>
                  </div>
                </div>
                <span class="text-[10px] font-semibold text-amber-800 bg-[#FFF4DB] px-2 py-0.5 rounded-full border border-[#EB8D0A]/30">MedGemma Derm</span>
              </div>

              <!-- Suggested Prompts (Exact departmentPrompts for Dermoscopy) -->
              <div class="px-3 py-2 bg-[#F8FAFC] border-b border-[#DCE2EA] flex items-center gap-1.5 overflow-x-auto shrink-0">
                <span class="px-2.5 py-1 bg-white hover:bg-slate-50 border border-[#DCE2EA] rounded-full text-[10.5px] font-medium text-[#16233B] whitespace-nowrap">Summarize ABCD criteria</span>
                <span class="px-2.5 py-1 bg-white hover:bg-slate-50 border border-[#DCE2EA] rounded-full text-[10.5px] font-medium text-[#16233B] whitespace-nowrap">Recommend excision margins</span>
                <span class="px-2.5 py-1 bg-white hover:bg-slate-50 border border-[#DCE2EA] rounded-full text-[10.5px] font-medium text-[#16233B] whitespace-nowrap">List differential diagnoses</span>
              </div>

              <!-- Chat Message Thread -->
              <div id="chat-thread" class="p-3.5 flex-1 overflow-y-auto flex flex-col gap-3 min-h-0 text-xs">
                <!-- User message -->
                <div id="msg-user" class="px-3.5 py-2.5 rounded-2xl bg-[#1D3463] text-white text-xs max-w-[85%] self-end shadow-xs" style="display: none; opacity: 0;">

                <!-- AI response -->
                <div id="msg-ai" class="px-3.5 py-2.5 rounded-2xl bg-[#F8FAFC] border border-[#DCE2EA] text-[#16233B] text-xs max-w-[92%] self-start flex flex-col gap-1.5 shadow-2xs" style="display: none; opacity: 0;">

                  <span id="chat-ph" class="text-[#8C98A9]">Ask clinical co-pilot about this dermoscopy...</span>

                <button id="chat-send-btn" class="w-8 h-8 rounded-xl bg-[#1D3463] text-white flex items-center justify-center shrink-0 shadow-xs cursor-pointer">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

      <script>
        (function() {
          const tl = gsap.timeline({ paused: true });
          window.__timelines = window.__timelines || {};
      window.__timelines["scene7-dermatology"] = tl;

      function buildTypingSteps(text) {
        const steps = [];
        for (let i = 1; i <= text.length; i++) {
          steps.push(text.slice(0, i));
        }
        return steps;
      }

      // Initial state
      tl.set("#cursor", { x: 500, y: 300, opacity: 0 });
      tl.set("#derm-contour", { scale: 0.9, opacity: 0 });
      tl.set("#msg-user", { display: "none", opacity: 0 });
      tl.set("#msg-ai", { display: "none", opacity: 0 });

      // 0.0s - 0.5s: Cursor enters
      tl.to("#cursor", { opacity: 1, duration: 0.3 }, 0.5);

      // 1.0s: AI ABCD Contour highlights lesion boundaries
      tl.to("#derm-contour", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 1.0);

      // 2.5s - 4.5s: Cursor inspects lesion and moves towards chat co-pilot
      tl.to("#cursor", { x: 380, y: 480, duration: 1.0, ease: "power2.inOut" }, 2.5);

      // 5.5s - 7.5s: Move cursor to Chat Input Box
      tl.to("#cursor", { x: 1600, y: 885, duration: 1.2, ease: "power2.inOut" }, 5.5);

      // 7.8s: Focus Chat Input
      tl.call(() => {
        document.getElementById("chat-ph").style.display = "none";
        document.getElementById("chat-caret").style.display = "inline-block";
        document.getElementById("chat-input-box").classList.add("border-[#1D3463]", "bg-white", "ring-2", "ring-[#1D3463]/10");
      }, null, 7.8);

      // 8.0s - 12.0s: Real character typing of question:
      const chatQuery = "Recommend surgical excision margins for this lesion?";
      const chatSteps = buildTypingSteps(chatQuery);
      chatSteps.forEach((str, i) => {
        const t = 8.0 + (i * 0.08);
        tl.call(() => {
          document.getElementById("chat-val").textContent = str;
        }, null, t);
      });

      // 12.5s - 13.2s: Move cursor to Send Button
      tl.to("#cursor", { x: 1870, y: 885, duration: 0.5, ease: "power2.inOut" }, 12.5);

      // 13.5s: Click Send
      tl.to("#chat-send-btn", { scale: 0.94, duration: 0.1 }, 13.5);
      tl.to("#chat-send-btn", { scale: 1, duration: 0.15 }, 13.6);

      // 13.7s: Show user bubble
      tl.call(() => {
        document.getElementById("chat-caret").style.display = "none";
        document.getElementById("chat-val").textContent = "";
        document.getElementById("chat-ph").style.display = "inline";
        document.getElementById("typed-query").textContent = chatQuery;
        const u = document.getElementById("msg-user");
        u.style.display = "block";
      }, null, 13.7);
      tl.to("#msg-user", { opacity: 1, duration: 0.2 }, 13.8);

      // 14.5s: AI Guidance streams in
      tl.call(() => {
        const a = document.getElementById("msg-ai");
        a.style.display = "flex";
      }, null, 14.5);
      tl.to("#msg-ai", { opacity: 1, duration: 0.4, ease: "power2.out" }, 14.6);

      // 16.0s - 17.5s: Move cursor to inspect excision margin recommendations
      tl.to("#cursor", { x: 1650, y: 560, duration: 1.2, ease: "power2.inOut" }, 16.0);

      // 18.0s - 19.5s: Move cursor to Diagnostic Impression in center report
      tl.to("#cursor", { x: 1100, y: 680, duration: 1.2, ease: "power2.inOut" }, 18.0);

      // 20.0s - 21.5s: Cursor glides toward Complete Diagnosis button
      tl.to("#cursor", { x: 1820, y: 95, duration: 1.2, ease: "power2.inOut" }, 20.0);

          tl.seek(0);
        })();
      </script>
