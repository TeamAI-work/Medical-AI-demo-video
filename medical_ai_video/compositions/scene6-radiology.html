              </span>
            </div>

            <div class="p-3 bg-[#F8FAFC] border border-[#DCE2EA] rounded-xl text-xs flex flex-col gap-2">
              <div class="flex justify-between font-mono text-[11px] text-[#637188]">
                <span>PATIENT: Eleanor Vance (58/F)</span>
                <span>MRN: PT-1002</span>
              </div>
              <div class="border-t border-[#E2E8F0] pt-2">
                <div class="font-bold text-[#16233B]">1. Urgent Thoracic Oncology Workup & PET-CT Staging</div>
                <div class="text-[11px] text-[#637188]">2. Codeine Phosphate Syrup 15mg/5mL — 10mL BID x 5 days</div>
              </div>
            </div>

            <div class="flex items-center justify-between pt-2">
              <span class="text-[10px] text-[#637188]">Signed: Dr. Sarah Mitchell, MD • License: MD-92104</span>
              <div class="flex items-center gap-2">
                <button id="print-rx-btn" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-[#1D3463] text-white">Print Prescription</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function() {
          const tl = gsap.timeline({ paused: true });
          window.__timelines = window.__timelines || {};
      window.__timelines["scene6-radiology"] = tl;

      function buildTypingSteps(text) {
        const steps = [];
        for (let i = 1; i <= text.length; i++) {
          steps.push(text.slice(0, i));
        }
        return steps;
      }

      // Initial state
      tl.set("#cursor", { x: 500, y: 300, opacity: 0 });
      tl.set("#ai-box", { scale: 0.9, opacity: 0 });
      tl.set("#msg-user", { display: "none", opacity: 0 });
      tl.set("#msg-ai", { display: "none", opacity: 0 });
      tl.set("#rx-modal-backdrop", { display: "none", opacity: 0 });

      // 0.0s - 0.5s: Cursor enters
      tl.to("#cursor", { opacity: 1, duration: 0.3 }, 0.5);

      // 0.8s: AI Bounding Box locks onto solitary mass
      tl.to("#ai-box", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.8);

      // 1.5s - 4.0s: Scrub through CT slices (Slider moves, label updates)
      tl.to("#cursor", { x: 380, y: 735, duration: 1.0, ease: "power2.inOut" }, 1.5);
      tl.to("#scrub-bar", { width: "72%", duration: 1.5, ease: "power1.inOut" }, 2.5);
      tl.call(() => {
        document.getElementById("slice-label").textContent = "SLICE 18 / 24";
      }, null, 3.2);

      // 5.0s - 7.5s: Cursor moves to Co-Pilot chat prompt box
      tl.to("#cursor", { x: 1600, y: 885, duration: 1.2, ease: "power2.inOut" }, 5.0);

      // 7.8s: Focus Chat Input
      tl.call(() => {
        document.getElementById("chat-ph").style.display = "none";
        document.getElementById("chat-caret").style.display = "inline-block";
        document.getElementById("chat-input-box").classList.add("border-[#1D3463]", "bg-white", "ring-2", "ring-[#1D3463]/10");
      }, null, 7.8);

      // 8.0s - 13.0s: Real human character-by-character typing:
      const chatQuery = "Fleischner recommendation for this 3.2cm mass?";
      const chatSteps = buildTypingSteps(chatQuery);
      chatSteps.forEach((str, i) => {
        const t = 8.0 + (i * 0.11);
        tl.call(() => {
          document.getElementById("chat-val").textContent = str;
        }, null, t);
      });

      // 13.5s - 14.2s: Move cursor to Send Button
      tl.to("#cursor", { x: 1870, y: 885, duration: 0.6, ease: "power2.inOut" }, 13.5);

      // 14.5s: Click Send Button
      tl.to("#chat-send-btn", { scale: 0.94, duration: 0.1 }, 14.5);
      tl.to("#chat-send-btn", { scale: 1, duration: 0.15 }, 14.6);

      // 14.7s: Clear input and show user message bubble
      tl.call(() => {
        document.getElementById("chat-caret").style.display = "none";
        document.getElementById("chat-val").textContent = "";
        document.getElementById("chat-ph").style.display = "inline";
        document.getElementById("typed-query").textContent = chatQuery;
        const u = document.getElementById("msg-user");
        u.style.display = "block";
      }, null, 14.7);
      tl.to("#msg-user", { opacity: 1, duration: 0.2 }, 14.8);

      // 15.5s: MedGemma synthesizes and returns guideline reply
      tl.call(() => {
        const a = document.getElementById("msg-ai");
        a.style.display = "flex";
      }, null, 15.5);
      tl.to("#msg-ai", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 15.6);

      // 18.0s - 20.0s: Move cursor to Rx tab in middle panel
      tl.to("#cursor", { x: 1220, y: 155, duration: 1.0, ease: "power2.inOut" }, 18.0);

      // 20.2s: Switch to Rx tab
      tl.call(() => {
        document.getElementById("tab-report").classList.remove("bg-[#1D3463]", "text-white");
        document.getElementById("tab-report").classList.add("text-[#637188]");
        document.getElementById("tab-rx").classList.add("bg-[#1D3463]", "text-white");
        document.getElementById("tab-rx").classList.remove("text-[#637188]");
        document.getElementById("report-content").style.display = "none";
        document.getElementById("rx-content").style.display = "flex";
      }, null, 20.2);

      // 22.0s - 24.0s: Move cursor to "Complete diagnosis" button at top right
      tl.to("#cursor", { x: 1820, y: 95, duration: 1.0, ease: "power2.inOut" }, 22.0);

      // 24.2s: Click "Complete diagnosis"
      tl.to("#rx-complete-btn", { scale: 0.95, duration: 0.1 }, 24.2);
      tl.to("#rx-complete-btn", { scale: 1, duration: 0.15 }, 24.3);

      // 24.5s: 1-Click Electronic Prescription Modal Pops Up
      tl.call(() => {
        const mb = document.getElementById("rx-modal-backdrop");
        mb.style.display = "flex";
      }, null, 24.5);
      tl.to("#rx-modal-backdrop", { opacity: 1, duration: 0.3 }, 24.6);
      tl.to("#rx-modal-card", { scale: 1, duration: 0.35, ease: "back.out(1.4)" }, 24.6);

      // 26.5s - 27.5s: Move cursor to "Print Prescription" button inside modal
      tl.to("#cursor", { x: 1140, y: 640, duration: 0.8, ease: "power2.inOut" }, 26.5);

      // 27.8s: Click "Print Prescription"
      tl.to("#print-rx-btn", { scale: 0.95, duration: 0.1 }, 27.8);
      tl.to("#print-rx-btn", { scale: 1, duration: 0.15 }, 27.9);
      tl.call(() => {
        const btn = document.getElementById("print-rx-btn");
        btn.textContent = "✓ Sent to Receptionist Desk & Pharmacy";
        btn.classList.remove("bg-[#1D3463]");
        btn.classList.add("bg-[#147145]");
      }, null, 28.2);

      // 31.0s - 34.0s: Modal smooth completion
      tl.to("#rx-modal-card", { scale: 0.98, opacity: 0.85, duration: 1.5, ease: "power2.inOut" }, 31.0);

          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
